append = pack
label = question-crossbase
extension = json
mimeType = application/json



# Champs communs aux deux bases (même nom quelle que soit la source) :
#   database (istex | openalex), title, author_name, affiliations, source, volume, issue, first_page, last_page,
#   publisher, type, publication_year, language, abstract, keywords, doi, uri
# Les autres champs restent propres à leur base.
[use]
plugin = basics
plugin = conditor
plugin = istex

[concat]

; on récupére les métadonnées et on les supprime 
[envExtract]
allow = OPENALEX_API_KEY

; Pour une requete en language naturel, on cible deux bases 
[exchange]
value = fix([{ \
        "id": "istex", \
        "query": String(self).trim(), \
        "size": 1000, \
        "maxPage": 100 \
    },{ \
        "id": "openalex", \
        "search": String(self).trim(), \
        "per-page": 200 \
    } \
    ]) 

; Traitement des èdeux bases en // 
[reduce]

; Traitement dédié à la base ISTEX
[reduce/swing]
test = get('id').isEqual('istex')

[reduce/swing/expand]
path = query
size = 1

[reduce/swing/expand/URLConnect]
url = https://text-lucene.services.istex.fr/v1/istex-search
timeout = 60000

[reduce/swing/debug]
text = ISTEX Query
[reduce/swing/ISTEXScroll]
field = *

[reduce/swing/singleton]
[reduce/swing/singleton/debug]
text = ISTEX Result
path = total

[reduce/swing/ISTEXResult]

; Reformatage du résulat
[reduce/swing/replace]
path = database
value = fix('istex')

path = title
value = get('title')

path = author_name
value = get('author').map('name')

path = affiliations
value = get('author').map('affiliations').filter(Boolean).map(function (b) { return b.filter(Boolean).filter(function(a) { return (a.search(/^E-mail:/) === -1 && a.search(/^Correspondence address:/) === -1) });})

path = source
value = get('host.title')

path = fix('Auteur(s) monographie')
value = get('host.author').map('name')

path = ISSN
value = get('host.issn').head()

path = e-ISSN
value = get('host.eissn', _.get(self, 'serie.eissn')).head()

path = ISBN
value = get('host.isbn').head()

path = e-ISBN
value = get('host.eisbn').head()

path = volume
value = get('host.volume')

path = issue
value = get('host.issue')

path = Chapitre
value = get('chapterId')

path = first_page
value = get('host.pages.first')

path = last_page
value = get('host.pages.last')

path = Nombre de pages
value = get('host.pages.total')

path = publisher
value = get('corpusName')
; forme pauvre, enrichie avec lodex-field après sur les data publisher.

path = Éditeur scientifique
value = get('editor', _.get(self, 'host.editor'), _.get(self, 'serie.editor'))
; on a tj editor.name(1 ou plus) et on peut avoir : editor.affiliation. je laisse en l'état, à voir.

path = Type de publication
value = get('host.genre').head()

path = type
value = get('genre').head()

path = Nom de la conférence
value = get('host.conference.name')

path = erratum de
value = get('erratumOf')

path = publication_year
value = get('publicationDate')

path = language
value = get('language').head()

path = abstract
value = get('abstract')
; l'API et dl.ixtex rendent en plus un @lang

path = keywords
value = get('subject').map('value')
; l'API et dl.ixtex rendent en plus un @lang

path = Mots-clés revue/monographie
value = get('host.subject').map(function(e) { return e.value })
; value = get('host.subject')   génère "[{value:xxx"}] pour chacune, ici on les regroupe sans "value"

path = Titre de la série
value = get('serie.title')

path = fix('Volume (série)')
value = get('serie.volume')

path = fix('Numéro (série)')
value = get('serie.issue')

; WoS : il peut y avoir plusieurs termes spécifiques (tag 2) qui partagent la même classification unique (tag 1).
; exemple : "1 - science", "2 - zoology", "2 - evolutionary biology"
; et on veut un objet Nom-Classification-outil pour chaque tag 2
path = Catégories WoS
value = get('categories.wos').filter((cat) => cat.startsWith('2 - ')).map(function createCat(nom) { return { Nom: nom, Classification: _.get(self, 'categories.wos.0'), Outils:  ['multicat'] } })

; Scopus : des groupes sémantiques successifs de 3 éléments, du plus générique (tag1) au plus spécifique (tag 3), groupes non séparés entre eux --> chunk
path = Catégories Scopus
value = get('categories.scopus').chunk(3).map(function(categories) { return { Nom: categories[2], Classification: _.slice(categories, 0, 2), Outils: ['multicat'] } } )

; ScienceMetrix : tj sur 3 niveaux, du plus générique (tag 1) au plus spécifique (tag 3)
; chunk ne sert qu'à recréer un tableau pour map et suite
path = Catégories Science-Metrix
value = get('categories.scienceMetrix').chunk(3).map(function(categories) { return { Nom: categories[2], Classification: _.slice(categories, 0, 2), Outils: ['multicat'] } } )

; Inist : sv 3 niveaux, parfois 4, du plus générique (tag 1) au plus spécifique (tag 4) ... parfois un seul (tag1) - ne s'affiche pas dans Lodex ce cas (crée tableau vide pour classification) ***
path = Catégories INIST
value = get('categories.inist').chunk(4).map(function(categories) { return { Nom: _.last(categories), Classification: _.slice(categories, 0, -1), Outils: ['nb'] } } )

path = fix('Mots-clés (teeft)')
value = get('keywords.teeft')

path = fix('Mots-clés (keyterm)')
value = get('keywords.keyterm')
; (pas encore disponibles)

path = fix('Entités nommées (Unitex)')
value = get('namedEntities.unitex')


; liste des outils utilisés :
path = Types d’enrichissement
value = get('enrichments.type')
; NB : dans les éléments disponibles, "enrichments.*.*"", ex :"enrichments.grobid.mimetype" donne l'URL des fichiers TEI enrichis.

path = Score qualité
value = get('qualityIndicators.score')

path = Version PDF
value = get('qualityIndicators.pdfVersion')

path = Nb mots PDF
value = get('qualityIndicators.pdfWordCount')

path = Nb mots par page PDF
value = get('qualityIndicators.pdfWordsPerPage')

path = Nb caractères PDF
value = get('qualityIndicators.pdfCharCount')

path = Nb pages PDF
value = get('qualityIndicators.pdfPageCount')

path = Taille pages PDF
value = get('qualityIndicators.pdfPageSize')

path = Nb mots du résumé
value = get('qualityIndicators.abstractWordCount')

path = Nb caractères du résumé
value = get('qualityIndicators.abstractCharCount')

path = Nb mots-clés
value = get('qualityIndicators.keywordCount')

; pdfText : true/false
path = PDF texte
value = get('qualityIndicators.pdfText')

; tdmReady : true/false
path = TDM ready
value = get('qualityIndicators.tdmReady')

; refBibsNative : true/false
path = Références biblio natives
value = get('qualityIndicators.refBibsNative')

; path = XML structuré
; value = fix('n/a')
; à finaliser plus tard

path = Identifiant ISTEX
value = get('_id')


; Traitements des identifiants
; choix de l'uri automatique
path = uri
value = get('arkIstex')

path = ARK
value = get('arkIstex')

path = doi
value = get('doi').head()

path = PMID
value = get('pmid').head()

path = DOI revue/monographie
value = get('host.doi').head()

; new : .head()
path = SICI
value = get('sici').head()
; pas de SICI revue/monographie

; new : .head()
path = PII
value = get('pii').head()

path = PII revue/monographie
value = get('host.pii')

path = PII série
value = get('serie.pii').head()

path = Références bibliographiques
value = get('refBibs')

; Traitement dédié à la base OPENALEX
[reduce/swing]
test = get('id').isEqual('openalex')

[reduce/swing/exchange]
value = self().omit('id')

[reduce/swing/assign]
path = api_key
value = env('OPENALEX_API_KEY')

[reduce/swing/debug]
text = OpenAlex Query

[reduce/swing/OAFetch]
url = https://api.openalex.org/works
timeout = 60000
retries = 1

; Reformatage du résulat 
[reduce/swing/replace]
; Champs communs avec ISTEX (mêmes noms des deux côtés), posés explicitement
path = database
value = fix('openalex')

path = title
value = get('title')

path = publication_year
value = get('publication_year')

path = type
value = get('type')

path = first_page
value = get('biblio.first_page')

path = last_page
value = get('biblio.last_page')

; Même forme que ISTEX : un tableau de chaînes par auteur
path = affiliations
value = get('authorships').map('raw_affiliation_strings')

; [D]
path = uri
value = get('id').replace('https://openalex.org/', '').prepend("uid:/")

path = doi
value = get('doi').replace("https://doi.org/","").toLower()

path = is_oa
value = get("open_access.is_oa").thru(bool=>bool === false ?"Non" : "Oui")

path = oa_status
value = get("open_access.oa_status").capitalize()

path = keywords
value = get('keywords').map('display_name')

path = author_name
value = get('authorships').map("author.display_name")

; [E] On récupère uniquement les auteurs du laboratoire requêté.

path = institutions
value = get('authorships').flatMap("institutions").map("display_name").uniq()

path = source
value = get("primary_location.source.display_name")

path = is_retracted
value = get("is_retracted").thru(bool=>bool === false ?"Non" : "Oui")

path = pages
value = get("biblio.first_page").concat(self.biblio.last_page).uniq().join(" to ")

path = volume
value = get("biblio.volume")

path = issue
value = get("biblio.issue")

; On récupère ici les 4 niveaux de classification, via Template strings on préfixe les valeurs de chaque niveau par un nombre correspondant à sa place hiérarchique. Nécéssaire pour créer un arbre hiérarchique.
path = classification
value = get("topics").map(item => `1 - ${item.domain.display_name}@2 - ${item.field.display_name}@3 - ${item.subfield.display_name}@4 - ${item.display_name}`).map(item=>item.split("@"))

path = domains
value = get("topics").map("domain.display_name")

path = fields
value = get("topics").map("field.display_name")

path = subfields
value = get("topics").map("subfield.display_name")

path = topics
value = get("topics").map("display_name")

path = codes_iso2
value = get("authorships").flatMap("countries").uniq()

; On récupère ici un code langue, auquel on applique un constructeur Javascript, qui verbalise et traduit le code. "fr" devient "français".
path = language
value = get("language").thru(d => d ? new Intl.DisplayNames(['FR'], { type: 'language'}).of(d) : 'n/a')

[reduce/swing/assign]
;On récupère des tableaux de codes Iso2, on enlève le code de la France. Puis on teste chaque tableau, s'il n'est pas vide on remplace par "Oui" (il y a d'autres pays donc collaboration), sinon par "Non".
path = collaborations_internationales
value = get("codes_iso2").without("FR").thru(arr=>!_.isEmpty(arr)).thru(bool=>bool === false ?"Non" : "Oui")

; On récupère ici un code Iso2, auquel on applique un constructeur Javascript, qui verbalise et traduit le code. "FRA" devient "France".
path = countries
value = get("codes_iso2").filter(d => _.isString(d) && d.length === 2).map(d => new Intl.DisplayNames(['FR'], { type: 'region'}).of(d))

; On récupère un tableau d'objets, puis on itère sur chaque objet avec un template string pour en faire une chaîne de caractères.
; Chaque chaîne est préfixée par "Goal", on récupère ensuite les derniers chiffres de la variable "id" qui correspond au numéro du goal.
; On ajoute enfin la variable "display_name" qui est le nom du goal.
path = sustainable_development_goals
value = get("sustainable_development_goals").map( item => `Goal ${item.id.match(/\/sdg\/(\d+)/)[1]} : ${item.display_name}`).thru(arr => _.isEmpty(arr) ? ["No sustainable development goal"] : arr)

path = funder_display_name
value = get("grants").map("funder_display_name").uniq()

; On récupère le nom des funders et leur id sous forme de matrice. On utilise ensuite _.compact dans chaque tableau pour que le _.join après ne concatène pas en cas d'absence de valeur à id,
; de sorte à ne pas avoir de valeur comme "funder : ". Le _.join sert à transformer la matrice en un seul tableau. On remplace ensuite les tableaux vides par ["n/a"].
path = funders_award_id
value = get("grants").map(obj=>[obj.funder_display_name,obj.award_id]).map(subarr=>_.compact(subarr)).map(subarr => subarr.join(" : ")).thru(arr => _.isEmpty(arr) ? ["n/a"] : arr)

; On teste si dans la liste des urls où sont déposés les "works", au moins une appartient à un portail Hal.
; La regex couvre l'ensemble des portails hal et la spécificité de leurs urls. (Oui et Non pour facette).
[reduce/swing/assign]
path = is_hal
value = get("locations").map("landing_page_url").compact().some(item=>(/[^a-zA-Z0-9]hal[^a-zA-Z0-9]/).test(item)).thru(bool=>bool === false ?"Non" : "Oui")

; On récupère le champ qui indique dans quelles bases bibliographiques sont indexés les "works".
; On concatène le champ "is_hal", on retire les "Non" et transforme les "Oui" en "hal".
[reduce/swing/assign]
path = indexed_in_hal_enriched
value = get("indexed_in").concat(self.is_hal).without("Non").map(item=>item === "Oui" ? "hal" : item).sort()

; On récupère l'éditeur de la revue. ([] si vide, nécessaire pour les instructions et fonctions futures).
[reduce/swing/assign]
path = publisher_only
value = get("primary_location.source.host_organization_name","n/a")

; On récupère un tableau avec l'éditeur mais aussi, s'il en a, sa ou ses sociétés mères (3 niveaux de hiérarchie).
; L'ordre est aléatoire, on ne peut se baser sur l'index. (["n/a"] si vide, nécéssaire pour les instructions et fonctions futures).
[reduce/swing/assign]
path = linked_publishers
value = get("primary_location.source.host_organization_lineage_names",["n/a"])

; On compare les 2 champ créés au-dessus, pour retirer du tableau les éditeurs du plus-bas niveau de hiérarchie.
; Si publisherOnly était au plus haut niveau (0) on obtient [].
; S'il était au niveau 1 on obtient son niveau supérieur (0).
; S'il était au plus bas on obtient ses 2 sociétés mères (0 & 1).
[reduce/swing/assign]
path = xor_publisher
value = get("publisher_only").castArray().xor(self.linked_publishers)

; On isole tous les tableaux vides.
[reduce/swing/swing]
test = get("xor_publisher").isEmpty()

; On leur réattribue leur unique valeur.
[reduce/swing/swing/assign]
path = xor_publisher
value = get("publisher_only")

; On associe le tout, ne reste plus que le cas des tableaux avec niveaux 0 et 1.
; On retire les parents directs des éditeurs de niveau 2, on n'a donc plus que les éditeurs du plus haut niveau.
[reduce/swing/assign]
path = publisher
value = get("xor_publisher").without("Springer Science+Business Media","Vandenhoeck & Ruprecht","University of California, Berkeley","University of California, Los Angeles","Siberian Branch of the Russian Academy of Sciences").toString().replace(null,"n/a").replace(undefined,"n/a")

; On recupère l'abstract sous forme d'un tableau d'objets où keys sont les mots et values leur(s) position(s) dans l'abstract ([{"the":[0,12,25]}...]).
; Les keys contiennent donc des "." ou autres caractères spéciaux proscrits MongoDB Node.js driver.
; On transforme cela en un tableau où chaque value est "key:value", on découpe pour avoir une matrice. On parse les values en base 10 pour obtenir des entiers.
; On inverse ensuite les éléments dans chaque sous-tableau de la matrice. On effectue un tri dans la matrice, on ne garde plus que les mots et transforme le tout en un string.

[reduce/swing/assign]
path = identify_author_name_error
value = get("authorships").groupBy("author.display_name").map((authors, displayName) => ({author_display_name: displayName,count: _.size(authors),raw_author_names: _.filter(_.map(authors, author => author.raw_author_name),Boolean)})).filter(entry => entry.count > 1)

[reduce/swing/assign]
path = display_author_name_error
value = get("identify_author_name_error").map(item =>`${item.author_display_name} apparaît ${item.count} fois sous les noms : ${item.raw_author_names.join(" || ")}`)

[reduce/swing/assign]
path = check_single_affiliation
value = get("authorships").map("raw_affiliation_strings").map(item=>item.join()).uniq().compact().size().thru(v=>v===1? _.size(self.authorships):"").replace(/^1$/,"")

[reduce/swing/assign]
path = identify_same_affiliation_for_all_authors
value=get('authorships').map('raw_affiliation_strings').map(i=>_.size(i)).some(i=>i===0).thru(bool=>bool === true ? "" : self.check_single_affiliation)

[reduce/swing/assign]
path = retrieve_affiliation_normalization_errors
value= get('filtered_and_tested_raw_affiliation_strings').thru(bool=>bool===false ? self.filtered_raw_affiliation_strings : [])

[reduce/swing/assign]
path = abstract
value = get("abstract_inverted_index").flatMap((values, key) => values.map(value => [value, key])).sort((a, b) => a[0] - b[0]).map(item => item[1]).join(' ')

;[F]
[reduce/swing/exchange]
value = omit(["ids","fwci","concepts","grants","datasets","versions","is_authors_truncated","biblio","abstract_inverted_index","indexed_in","display_name","publisher_only","xor_publisher","publication_date","countries_distinct_count","institutions_distinct_count","corresponding_author_ids","corresponding_institution_ids","has_fulltext","fulltext_origin","cited_by_percentile_year","is_paratext","primary_topic","locations_count","referenced_works","related_works","ngrams_url","cited_by_api_url","created_date","updated_date","check_single_affiliation"])
; }}}



[remove]
test = get('database').isEmpty()
; Ensures that each object contains an identification key (required by lodex)
[assign]
path = uri
value = fix(self.title, self.publication_year).join('').kebabCase()

[identify]
scheme = sha
content = get('uri')

; Ignore objects with duplicate URI
[dedupe]
ignore = true

; Prevent keys from containing dot path notation (which is forbidden by nodejs mongoDB driver)
[OBJFlatten]
separator = fix('.')
reverse = true
safe = true

; Uncomment to see in server logs, each data sent to the database
;[debug]
;path = uri
;path = database

# Add contextual metadata related to the import
[assign]
path = lodexStamp.importedDate
value = fix(new Date()).thru(d => d.toDateString())
path = lodexStamp.usedParser
value = env('parser')
path = lodexStamp.uploadedFilename
value = env('source')
path = importDateTime
value = fix(new Date()).thru(d => \
  new Intl.DateTimeFormat("fr-FR", { \
    timeZone: "Europe/Paris", \
    year: "numeric", \
    month: "long", \
    day: "numeric", \
    hour: "2-digit", \
    minute: "2-digit", \
    second: "2-digit" \
  }).format(d) \
)
path = uri
value = get('uri').trim()


