append = pack
label = query-theses-fr-for-model

[use]
plugin = basics

[TXTConcat]

[replace]
path = baseUrl
value = self().trim()

path = query
value = self().trim()

path = pageSize
value = 100

[URLFetch]
url = get("baseUrl").replace(/([?&])debut=\d+/, "$1debut=0").replace(/([?&])nombre=\d+/, "$1nombre=1")
target = firstPage
json = true
timeout = 150000
noerror = true
retries = 3

[assign]
path = urls
value = fix(Array.from({ length: Math.ceil(self.firstPage.totalHits / self.pageSize) }, (v, i) => i * self.pageSize)) \
  .map(debut => ({ \
    url: self.baseUrl \
      .replace(/([?&])debut=\d+/, "$1debut=" + debut) \
      .replace(/([?&])nombre=\d+/, "$1nombre=" + self.pageSize), \
    query: self.query \
  }))

[exchange]
value = get("urls")

[ungroup]

[URLFetch]
url = get("url")
target = value
json = true
timeout = 150000
noerror = true
retries = 3

[exchange]
value = get("value.theses").map(these => Object.assign(these, { query: self.query }))

[ungroup]

[env]
path = formatPersonnes
value = fix(personnes => \
  _.chain(_.castArray(personnes)) \
    .compact() \
    .map(personne => _.compact([personne.nom, personne.prenom]).join(", ")) \
    .compact() \
    .uniq() \
    .thru(result => _.isEmpty(result) ? ["Non renseigné"] : result) \
    .value() \
)

path = formatPersonnesPpn
value = fix(personnes => \
  _.chain(_.castArray(personnes)) \
    .compact() \
    .map("ppn") \
    .compact() \
    .uniq() \
    .thru(result => _.isEmpty(result) ? ["Non renseigné"] : result) \
    .value() \
)

[assign]
path = uri
value = get("id")

path = anneeSoutenance
value = get("dateSoutenance").split("/").last()

path = anneeInscription
value = get("datePremiereInscriptionDoctorat").split("/").last()

path = statutThese
value = get("status").thru(status => status === "enCours" && _.isEmpty(self.dateSoutenance) ? "En cours" : status === "soutenue" ? "Soutenue" : "Soutenue - document en traitement")

[assign]
path = anneeReference
value = fix(self.anneeSoutenance,self.anneeInscription).compact().max().toString()

path = titreSecondaire
value = get("titrePrincipal").thru(titre => \
  titre === self.titreEN ? "" : self.titreEN \
)

[assign]
path = auteurs
value = get("auteurs").thru(env("formatPersonnes"))

path = auteursPpn
value = get("auteurs").thru(env("formatPersonnesPpn"))

path = directeurs
value = get("directeurs").thru(env("formatPersonnes"))

path = directeursPpn
value = get("directeurs").thru(env("formatPersonnesPpn"))

path = rapporteurs
value = get("rapporteurs").thru(env("formatPersonnes"))

path = rapporteursPpn
value = get("rapporteurs").thru(env("formatPersonnesPpn"))

path = examinateurs
value = get("examinateurs").thru(env("formatPersonnes"))

path = examinateursPpn
value = get("examinateurs").thru(env("formatPersonnesPpn"))

path = president
value = get("president").thru(env("formatPersonnes"))

path = presidentPpn
value = get("president").thru(env("formatPersonnesPpn"))

path = etabSoutenanceNormalises
value = get("etabSoutenanceN") \
    .replace(/\s*\([^)]*\)\s*$/, "") \
    .trim()

path = ecolesDoctorale
value = get("ecolesDoctorale").map(ecole => ecole.nom).compact()

path = ecolesDoctoralePpn
value = get("ecolesDoctorale").map("ppn").compact()

[assign]
path = auteursEtDirecteursPourRéseau
value = fix([self.auteurs,self.directeurs]).flatten()

path = ecolesDoctoraleNormalisees
value = get("ecolesDoctorale").map(ecole => \
  _.chain(ecole) \
    .replace(/^École doctorale\s+/i, "ED ") \
    .replace(/^Ecole doctorale\s+/i, "ED ") \
    .replace(/\s*\([^)]*\)\s*$/, "") \
    .replace(/\s+/g, " ") \
    .trim() \
    .value() \
)

path = partenairesDeRecherche
value = get("partenairesDeRecherche").map(partenaire => \
  _.compact([partenaire.type, partenaire.nom]).join(" : ") \
)

path = partenairesDeRechercheNormalises
value = get("partenairesDeRecherche").map(partenaire => \
  _.compact([ \
    _.chain(partenaire.type) \
      .deburr() \
      .lowerCase() \
      .replace("etablissement co accredite", "Établissement co-accrédité") \
      .replace("etablissement operateur d inscription", "Établissement opérateur d'inscription") \
      .replace("etablissement de preparation de la these", "Établissement de préparation de la thèse") \
      .replace("etablissement de preparation", "Établissement de préparation de la thèse") \
      .replace("etablissement delivrant conjointement le doctorat", "Établissement délivrant conjointement le doctorat") \
      .replace("equipe de recherche", "Equipe de recherche") \
      .replace("laboratoire", "Laboratoire") \
      .replace("graduate school", "Graduate school") \
      .replace("referent", "Référent") \
      .replace("financeur", "Financeur") \
      .replace("entreprise", "Entreprise") \
      .replace("autre partenaire", "Autre partenaire") \
      .replace("faculte", "Faculté") \
      .value(), \
    _.trim(partenaire.nom.replace(/\s*\([^)]*\)\s*$/, "")) \
  ]).join(" : ") \
)

path = partenairesDeRecherchePpn
value = get("partenairesDeRecherche").map("ppn").compact()

path = discipline
value = get("discipline").capitalize()

path = sujets
value = get("sujets").filter({ langue: "fr" }).map("libelle").compact().map(word => _.startCase(word))

path = sujetsEN
value = get("sujets").filter({ langue: "en" }).map("libelle").compact().map(word => _.startCase(word))

path = sujetsRameau
value = get("sujetsRameau").map("libelle").compact()

path = sujetsRameauPpn
value = get("sujetsRameau").map("ppn").compact()

path = importedDate
value = fix(new Date()).thru(d => new Intl.DateTimeFormat("fr-FR", { year: "numeric", month: "long", day: "numeric" }).format(d))

path = importDateTime
value = fix(new Date()).thru(d => \
  new Intl.DateTimeFormat("fr-FR", { \
    timeZone: "Europe/Paris", \
    year: "numeric", \
    month: "long", \
    day: "numeric", \
    hour: "2-digit", \
    minute: "2-digit", \
    second: "2-digit" \
  }).format(d) \
)

[swing]
test = pick(['URI', 'uri']).pickBy(_.identity).isEmpty()

[swing/identify]

[dedupe]
ignore = true
