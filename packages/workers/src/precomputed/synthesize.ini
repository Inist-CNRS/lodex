[use]
plugin = basics

[JSONParse]
separator = *

; Attribution d'un identifiant commun à tous les documents
; afin de permettre leur agrégation dans un seul objet.
; Conservation des données originales dans la clé value.
[replace]
path = id
value = fix("doc")

path = value
value = self()

; Regroupement de l'ensemble des documents à partir de leur identifiant commun.
[aggregate]
path = id

; Génération d'un identifiant unique (URI) pour le document agrégé.
[identify]

[replace]
path = id
value = get("uri")

; Calcul du nombre total de documents.
; Identification dynamique de tous les champs du corpus.
;
; Pour chaque champ :
; - Transformation des valeurs simples en tableaux.
; - Aplatissement des tableaux en conservant les doublons.
; - Remplacement des valeurs manquantes par "Non renseigné".
; - Calcul du nombre d'occurrences de chaque valeur.
; - Calcul du nombre de valeurs distinctes,
;   à l'exclusion de "Non renseigné".
path = value
value = get("value").thru(rows => ({ \
    total: rows.length, \
    ...Object.fromEntries( \
        _.uniq(rows.flatMap(row => Object.keys(row))) \
            .filter(name => name !== "id") \
            .map(name => [ \
                name, \
                _.chain(rows) \
                    .flatMap(row => Array.isArray(row[name]) && row[name].length === 0 ? [null] : _.castArray(row[name])) \
                    .map(v => _.isNil(v) || v === "" ? "Non renseigné" : v) \
                    .countBy() \
                    .thru(repartition => ({ \
                        repartition, \
                        distincts: Object.keys(repartition).filter(v => v !== "Non renseigné").length \
                    })) \
                    .value() \
            ]) \
    ) \
}))