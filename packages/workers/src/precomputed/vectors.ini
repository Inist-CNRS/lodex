[use]
plugin = lodex

; On garde dans l'enviornnment quelques variables issues de la config Lodex
[config2env]
path = tdmservices

[env]
path = generator
value = vector


# Step 1 (générique): Charger le fichier corpus
[delegate]
file = ./shared/charger.cfg

[truncate]
length = env('tdmservices.embedding.limit')

# Step 2 (générique): Traiter de manière asynchrone les items reçus
[fork]
standalone = true
logger = ./shared/logger.cfg

# Step 2.0 (optionnel): Accélère le détachement du fork si l'enrichissement est lent
[fork/delegate]
file = ./shared/buffer.cfg

# Step 2.1 (spécifique): Lancer un calcul sur tous les items reçus
[fork/delegate]

[fork/delegate/assign]
path = value
value = fix(_.zipObject(self.name, self.value)).reduce((accumulator, value, key) => accumulator.concat(`# ${key} :\n${_.toString(value)}\n\n`), '') 

# Step 2.1.1 (spécifique): S'assurer d'avoir des tableaux de tableaux
[fork/delegate/expand]
path = value
size = 10
# It is unlikely that the values to be transformed will be the same
#cacheName = embedding

[fork/delegate/expand/assign]
path = value
value = get('value').castArray().map(_.toString).join('\n|\n')

[fork/delegate/expand/URLConnect]
url = env('tdmservices.embedding.url')
timeout = env('tdmservices.embedding.timeout')
noerror = false

[fork/delegate/expand/replace]
path = id 
value = get('id')
path = value
value = get('value.vector')

# Step 2.2 (générique): Enregistrer le résultat et signaler que le traitement est fini
[fork/delegate]
file = ./shared/recorder.cfg

# Step 3 : Renvoyer immédiatement un seul élément indiquant comment récupérer le résulat quand il sera prêt
[delegate]
file = ./shared/recipient.cfg

