[use]
plugin = basics
plugin = analytics

# Si yne valeur est vide, on lui donne une valeur fixe
[swing]
test = get('value').thru(v => _.isNil(v) || v === '') 
[swing/assign]
path = value
value = fix('n/a')

[debug]
text = avant
# Agrège les identifiants pour chaque valeur distinctes 
[reducing]
id = value
value = id

[replace]
# Contient une valeur distincte
path = id
value = get('id')

# Contient le nombre de fois que la valeur a été trouvée
path = value
value = get('value').size()

# Contient la liste URI de documents ayant la valeur, permet également l'usage de routine pour les pré calculs avec filtre (ex: value-precomputed)
path = origin
value = get('value')

