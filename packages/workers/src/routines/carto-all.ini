# Liste et compte les valeurs distinctes de tous les documents

prepend = delegate?file=../worker.ini
mimeType = application/json
label = carto-all

[use]
plugin = basics
plugin = lodex

[buildContext]
connectionStringURI = get('connectionStringURI')

[LodexAggregateQuery]
# 1. Un document par couple (champ, valeur) de lastVersion
stage = $project: { kv: { $objectToArray: "$lastVersion" } }
stage = $unwind: "$kv"
# 2. On écarte les valeurs vides
stage = $match: { "kv.v": { $nin: [null, "", []] } } 
# 3. Nombre d'occurrences de chaque valeur, par champ
stage = $group: { \
      _id: { id: "$kv.k", value: "$kv.v" }, \
      n: { $sum: 1 } \
  }
# 4. Regroupement par champ : total + liste (valeur, occurrences)
stage = $group: { \
      _id: "$_id.id", \
      count: { $sum: "$n" }, \
      values: { $push: { \
        k: { $convert: { input: "$_id.value", to: "string", onError: "[objet/tableau]" } }, \
        v: "$n" \
      } } \
  }
# 5. Mise en forme finale
stage = $project: { \
      _id: 0, \
      id: "$_id", \
      count: 1, \
      values: { $arrayToObject: "$values" } \
  }
# 6. On retrie le tout 
stage = $sort: { id: 1 }


[LodexOutput]
indent = true
extract = total
