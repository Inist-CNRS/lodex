prepend = delegate?file=../worker.ini
mimeType = application/json
label = vsearch-precomputed

[use]
plugin = basics
plugin = lodex

; On garde dans l'enviornnment quelques variables issues de la config Lodex
[config2env]
path = tdmservices

[env]
path = connectionStringURI
value = get('connectionStringURI')

[buildContext]
connectionStringURI = env('connectionStringURI')
tenant =  get('tenant')
precomputedName =  get('precomputedName')

[env]
path = total
value = get('total').parseInt().defaultTo(0)

path = minValue
value = env('minValue').parseInt().defaultTo(0)

path = maxValue
value = env('maxValue').parseInt().defaultTo(1000000)

path = maxSize
value = env('maxSize').parseInt().defaultTo(10)

path = reverse
value = env('orderBy').split('/').get(1).replace('asc', 1).replace('desc', 0).parseInt()

path = tuneBy
value = env('orderBy').split('/').get(0).replace('_id', 'id')

path = fields
value = get('fields')

; On récupére les documents filtrés


[assign]
path = queryVector
value = get('filter.$text.$search').defaultTo('a')

[expand]
path = queryVector
size = 1
cacheName = embedding

[expand/URLConnect]
url = env('tdmservices.embedding.url')
timeout = 5000
noerror = false

[expand/replace]
path = id 
value = get('id')
path = value
value = get('value.vector')

[runVSearchPrecomputed]
valueFieldName = env('precomputedValueColumn').defaultTo('value')
labelFieldName = env('precomputedLabelColumn').defaultTo('id')
dimensions = env('tdmservices.embedding.dimensions')

[assign]
path = doc
value = get('documents').find({ 'uri': self.id }).get('lastVersion')

[assign]
path= doc.id
value = get('id')
path= doc.uri
value = get('id')
path = doc.value
value = get('value')
path = doc.total
value = get('total')

[exchange]
value = get('doc')

[semanticMapping]
fields = env('fields')
from = http://purl.org/dc/terms/title
to = title
from = http://purl.org/dc/terms/identifier
to = identifier

[injectSyndicationFrom]
connectionStringURI = env('connectionStringURI')
path = id

; Send only a part of the data
[slice]
start = 1
size = env('maxSize')

; find the fields which are selected for title and summary
[assign]
path = title
value = get('id_title')

path = summary
value = get('id_summary')

path = detail1
value = get('id_detail1')

path = detail2
value = get('id_detail2')

path = subtitle
value = get('id_subtitle')

path = date_published
value = get('publicationDate')

path = url
value = env('host').concat('/').concat(self.id)

; Create and structured output
[LodexOutput]
keyName = items
indent = true
extract = total

