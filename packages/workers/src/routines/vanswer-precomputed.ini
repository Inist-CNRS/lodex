prepend = delegate?file=../worker.ini
mimeType = application/json
label = vanswer-precomputed

[use]
plugin = basics
plugin = lodex

; On garde dans l'environnent quelques variables issues de la configuration Lodex
[config2env]
path = tdmservices

; On garde dans l'environnent quelques variables issues de la query url
[env]
path = connectionStringURI
value = get('connectionStringURI')

; On crée à partir de la query url un objet plus riche avec tout le context Lodex
[buildContext]
connectionStringURI = env('connectionStringURI')
tenant =  get('tenant')
precomputedName =  get('precomputedName')

; On garde dans l'environnent quelques variables issues du contexte Lodex
[env]
path = total
value = get('total').parseInt().defaultTo(0)

path = minValue
value = env('minValue').parseInt().defaultTo(0)

path = maxValue
value = env('maxValue').parseInt().defaultTo(1000000)

path = maxSize
value = env('maxSize').parseInt().defaultTo(10)

path = reverse
value = env('orderBy').split('/').get(1).replace('asc', 1).replace('desc', 0).parseInt()

path = tuneBy
value = env('orderBy').split('/').get(0).replace('_id', 'id')

path = fields
value = get('fields')

path = textFields
value = get('fields').filter({searchable: true}).map('name')

path = nameFields
value = get('fields').map('name')

path = labelFields
value = get('fields').map('label')

path = queryVector
value = get('filter.$text.$search').defaultTo('')

path = host
value = get('host')

; -----------------------------------------------------------------------------
; Si il n'y a pas de requête  le flux s'arrête ici
[assign]
path = queryVector
value = env('queryVector')

[remove]
test = get('queryVector').isEmpty()

; -----------------------------------------------------------------------------
; On reformule la question (champ queryVector) avec le ws de reformulation
[expand]
path = queryVector
size = 1
[expand/replace]
path = id
value = get('id')

path = value.question
value = get('value')

path = value.historique
#TODO
value = fix([])

[expand/debug]
text = env('tdmservices.reformulate.url')

[expand/URLConnect]
url = env('tdmservices.reformulate.url')
timeout = env('tdmservices.reformulate.timeout')
noerror = false

; -----------------------------------------------------------------------------
; On vectorise la question (champ queryVector) avec le ws d'embedding
[expand]
path = queryVector
size = 1
; We avoid recalculating identical queries
cacheName = embedding

[expand/debug]
text = env('tdmservices.embedding.url')

[expand/URLConnect]
url = env('tdmservices.embedding.url')
timeout = env('tdmservices.embedding.timeout')
noerror = false

; le ws renvoie plusieurs champs on en garde qu'un
[expand/replace]
path = id
value = get('id')
path = value
value = get('value.vector')

; -----------------------------------------------------------------------------
; une fois transformée en vecteur, on recherche les vecteurs les proches dans la base
[debug]
text = Recherche de similarité avec
path = filter
path = tenant
path = maxSize
path = orderBy

[runVSearchPrecomputed]
valueFieldName = env('precomputedValueColumn').defaultTo('value')
labelFieldName = env('precomputedLabelColumn').defaultTo('id')
dimensions = env('tdmservices.embedding.dimensions')
threshold = env('tdmservices.embedding.threshold')

; -----------------------------------------------------------------------------
; Si il n'y a pas de résultat le flux s'arrête ici
[debug]
text = Documents trouvés dans la base

[remove]
test = get('total').isEqual(0)

; -----------------------------------------------------------------------------
; On reformate  les objets documents en sélectionnant les champs selon les schemes
; pour créer un flux compatible avec le service de rag
[replace]
path = metadata
value = get('documents').find({ 'uri': self.id }).get('lastVersion')

path = id
value = get('id')

path= uri
value = get('id')

path = value
value = get('value')

path = total
value = get('total')


; Création d'un texte compatible avec les IA
[assign]
path = text
value = get('metadata').pick(env('textFields'))

[keyMapping]
path = text
from = env('nameFields')
to = env('labelFields')

[assign]
path = text
value = get('text').reduce((accumulator, value, key) => accumulator.concat(`# ${key} :\n${_.toString(value)}\n\n`))

; on transforme les identifiants techniques en champs labellisés en fonction des schemes souhaités
[semanticMapping]
path = metadata
fields = env('fields')

from = http://purl.org/dc/terms/title
to = titre

from = http://purl.org/dc/terms/creator
to = auteurs

from = http://purl.org/dc/terms/date
to = date_publication

from = http://purl.org/ontology/bibo/journal
to = journal

from = http://purl.org/ontology/bibo/volume
to = volume

from = http://purl.org/ontology/bibo/issue
to = numero

from = http://purl.org/ontology/bibo/pages
to = pages

from = http://purl.org/ontology/bibo/doi
to = doi

from = http://purl.org/dc/terms/language
to = langue

from = http://purl.org/dc/terms/subject
to = mots_cles

from = http://purl.org/dc/terms/type
to = type_document

from = http://schema.org/accessMode
to = acces

from = http://purl.org/ontology/bibo/collection
to = corpus

from = http://purl.org/dc/terms/abstract
to = resume


; -----------------------------------------------------------------------------
; le ws rag demande tous les documents dans le champ value
; On prend uniquement les N premiers résultats
; pour créer le flux compatible
[group]
length = env('maxSize')

[shift]

; on crée les 3 champs obligatoires demandé par rag
[replace]
path = value.documents
value = self()
path = value.question
value = env('queryVector')
; #TODO
path = value.historique
value = fix([])

; appel du ws sur le champ value
[expand]
path = value
size = 1

[expand/debug]
text = env('tdmservices.rag.url')

[expand/URLConnect]
url = env('tdmservices.rag.url')
timeout = env('tdmservices.rag.timeout')
noerror = false

; rag renvoie plusieurs champs on ne prend que celui contenant les résultats
[expand/replace]
path = id
value = get('id')
path = value
value = get('value.answer')

; On transforme le tableau de résultats pour traiter chaque document séparément
[ungroup]
path = value

; -----------------------------------------------------------------------------
; On produit un format de sortie standard pour Lodex
[LodexOutput]
keyName = items
indent = true
extract = total

