# For one document selected by a URI (otherwise the first of the stream),
# and with one field on parameter, we build a vector from the initial document
# and all documents that shared one or more values of the field
#
# Be careful :  works only with @ezs/lodex > 1.0.1
prepend = delegate?file=../worker.ini
mimeType = application/json
label = similar-by

[use]
plugin = basics
plugin = lodex
plugin = analytics

; On garde dans l'environnent quelques variables issues de la config Lodex
[config2env]
path = tdmservices

; On garde dans l'environnement quelques paramètres passé dans l'URL
[env]
path = connectionStringURI
value = get('connectionStringURI')

path = precomputedName
value = get('precomputedName')

path = minValue
value = env('minValue').split('§').map(parseFloat).shift().defaultTo(0)

path = maxValue
value = env('maxValue').split('§').map(parseFloat).shift().defaultTo(1)

path = maxSize
value = env('maxSize').parseInt().defaultTo(10)

path = reverse
value = env('orderBy').split('/').get(1).replace('asc', 0).replace('desc', 1).parseInt()

; A partir des paramètres de l'URL on construit un objet permettant de faire une recherche dans la base mongoDB
[buildContext]
connectionStringURI = env('connectionStringURI')

; On garde dans l'environnement quelques éléments produit pas buildContext
[env]
path = uri
value = get('filter.uri')

path = fields
value = get('fields')

path = field
value = get('field').castArray()

path = titleFieldName
value = get('fields').find({'overview':1}).get('name')

path = summaryFieldName
value = get('fields').find({'overview':2}).get('name')

path = detail1FieldName
value = get('fields').find({'overview':3}).get('name')

path = detail2FieldName
value = get('fields').find({'overview':4}).get('name')

path = subtitleFieldName
value = get('fields').find({'overview':6}).get('name')

; -----------------------------------------------------------------------------
; On récupère les documents filtrés (ici on doit trouvé uniquement un document avec son uri)
[LodexRunQuery]

; Si il n'y a pas de résultat le flux s'arrête ici
[remove]
test = get('total').isEqual(0)

; On supprime les informations inutiles
[filterVersions]
[filterContributions]

# On prend uniquement le premier (c'est une sécurité car normalement le nombre de résultat de la requête est 0 ou 1)
[shift]

# Préparation de la requête de rapprochement
[replace]

; -----------------------------------------------------------------------------
; On prend le titre du document comme requête pour trouver les documents similaires
path = queryVector
value = get(env('titleFieldName')).toString()

path = connectionStringURI
value = env('connectionStringURI')

path = referer.id
value = get('uri')

path = referer.value
value = get('value')

path = referer.key
value = env('field.0')

[assign]
path = filter.uri.$ne
value = get('referer.id')

[remove]
test = get('queryVector').isEmpty()

; On encode le champ contenant une requête en vecteur
[expand]
path = queryVector
size = 1
; We avoid recalculating identical queries
; cacheName = embedding

[expand/debug]
text = env('tdmservices.embedding.url')

[expand/URLConnect]
url = env('tdmservices.embedding.url')
timeout = env('tdmservices.embedding.timeout')
noerror = false

[expand/replace]
path = id
value = get('id')
path = value
value = get('value.vector')

; -----------------------------------------------------------------------------
[debug]
text = Recherche de similarité avec
path = filter
path = tenant
path = maxSize
path = orderBy

; On lance la requête de recherche de vecteur dans MongoT
[runVSearchPrecomputed]
precomputedName = env('precomputedName')
dimensions = env('tdmservices.embedding.dimensions')
threshold = env('tdmservices.embedding.threshold')

[debug]
text = Documents trouvés dans la base

[remove]
test = get('total').isEqual(0)

; On s'assure de renvoyer le nombre maximun de documents demandés
[slice]
start = 1
size = env('maxSize')

; Remove useless data
[filterVersions]
[filterContributions]

; -----------------------------------------------------------------------------
; Séries d'instruction pour re-formater le JSON
[assign]
path = uri
value = get('id')

path = host
value = env('host')

[assign]
path = title
value = get('documents.0.lastVersion').get(env('titleFieldName')).toString()

path = summary
value = get('documents.0.lastVersion').get(env('summaryFieldName')).toString()

path = detail1
value = get('documents.0.lastVersion').get(env('detail1FieldName')).toString()

path = detail2
value = get('documents.0.lastVersion').get(env('detail2FieldName')).toString()

path = subtitle
value = get('documents.0.lastVersion').get(env('subtitleFieldName')).toString()

path = date_published
value = get('documents.0.lastVersion').get('publicationDate')

path = url
value = pick(['host', 'uri']).values().join('/')

; Keep only the necessary data
[keep]
path = id
path = url
path = title
path = summary
path = detail1
path = detail2
path = subtitle
path = date_published
path = total

; Create and structured output
[LodexOutput]
keyName = items
indent = true
extract = total
