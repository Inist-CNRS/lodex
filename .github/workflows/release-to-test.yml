name: 'Move released tickets to "To test"'
on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Release tag (ex: v16.19.2)'
                required: true

jobs:
    to-test:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Update the Project cards
              shell: bash
              env:
                  # PAT with the "project" scope: the default GITHUB_TOKEN cannot write to an organization Project
                  GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
                  TAG: ${{ github.event.release.tag_name || inputs.tag }}
              run: bash .github/workflows/release-to-test.sh
