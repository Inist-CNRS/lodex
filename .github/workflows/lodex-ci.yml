name: Lodex CI

# Run this ci only on pull request who targets master and on master branch only
on:
    push:
        branches: [master, v14, v16, marmelab]
    pull_request:
        branches: [master, v14, v16, marmelab]

jobs:
    # Job use to create the test environment and run unit test suite
    test-unit:
        runs-on: ubuntu-22.04

        # Set a timeout of 20 mins
        timeout-minutes: 20

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run unit test suite
            - run: npm run test:unit

    # Job use to create the test environment and run e2e test suite
    test-e2e:
        runs-on: ubuntu-22.04

        # Set a timeout of 30 mins
        timeout-minutes: 30

        # Create a strategy matrix uses to test multiple versions of node and multiple subset tests
        strategy:
            fail-fast: false
            matrix:
                node-version: [24.x]
                test-phase:
                    ['phase:one', 'phase:two', 'phase:three', 'phase:four']
                # Use this line to ignore the phase system
                # test-phase: [ 'all' ]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Build the api image with layer cache shared between runs
            - uses: docker/setup-buildx-action@v3
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  build-args: node_env=e2e
                  load: true
                  tags: lodex-e2e-api:local
                  cache-from: type=gha,scope=e2e-api
                  cache-to: type=gha,mode=max,scope=e2e-api

            # Start e2e environment (reuses the image built above)
            - run: make test-e2e-start-dockers

            # Wait for the e2e environment to start and then run e2e subset tests suite
            - run: ./bin/wait-for -t 180 localhost:3000
            - run: npm run test:e2e:${{ matrix.test-phase }}

            # Stop e2e environment
            - run: make test-e2e-stop-dockers

            # Upload debug screenshots on failure
            - name: Upload screenshots
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: cypress-screenshots
                  path: cypress/screenshots
    lint:
        runs-on: ubuntu-22.04

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run lint
            - run: npm run lint:test
    type-check:
        runs-on: ubuntu-22.04

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run lint
            - run: npm run type-check
