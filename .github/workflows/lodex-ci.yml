name: Lodex CI

# Run this ci only on pull request who targets master and on master branch only
on:
    push:
        branches: [master, v14, v16, marmelab]
    pull_request:
        branches: [master, v14, v16, marmelab]

jobs:
    # Job use to create the test environment and run unit test suite
    test-unit:
        runs-on: ubuntu-22.04

        # Set a timeout of 20 mins
        timeout-minutes: 20

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run unit test suite
            - run: npm run test:unit

    # Job use to create the test environment and run e2e test suite
    test-e2e:
        runs-on: ubuntu-22.04

        # Set a timeout of 30 mins
        timeout-minutes: 30

        # Create a strategy matrix uses to test multiple versions of node and multiple subset tests
        strategy:
            fail-fast: false
            matrix:
                node-version: [24.x]
                test-phase:
                    [
                        'phase:one',
                        'phase:two',
                        'phase:three',
                        'phase:four',
                        'phase:five',
                    ]
                # Use this line to ignore the phase system
                # test-phase: [ 'all' ]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Start e2e environment (api runs from the build above, see docker-compose.spec.ci.yml)
            - run: make test-e2e-start-dockers

            # Wait for the e2e environment to start and then run e2e subset tests suite
            - run: ./bin/wait-for -t 180 localhost:3000
            - run: npm run test:e2e:${{ matrix.test-phase }}

            # Stop e2e environment
            - run: make test-e2e-stop-dockers

            # Save api/workers logs on failure (uploaded with the screenshots)
            - name: Dump e2e logs
              if: failure()
              run: |
                  mkdir -p cypress/screenshots
                  docker compose -f docker-compose.spec.yml -f docker-compose.spec.ci.yml logs --no-color --timestamps api workers > cypress/screenshots/docker-logs.txt

            # Upload debug screenshots on failure
            - name: Upload screenshots
              uses: actions/upload-artifact@v4
              if: failure()
              with:
                  # One artifact per shard: v4 refuses two uploads with the same name
                  name: cypress-screenshots-${{ strategy.job-index }}
                  path: cypress/screenshots
    lint:
        runs-on: ubuntu-22.04

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run lint
            - run: npm run lint:test
    type-check:
        runs-on: ubuntu-22.04

        # Create a strategy matrix uses to test multiple versions of node
        strategy:
            fail-fast: false
            matrix:
                # See https://github.com/nodejs/Release
                node-version: [24.x]

        steps:
            # Pull repository content
            - uses: actions/checkout@v4

            # Install (cached) dependencies and build project
            - uses: ./.github/actions/setup
              with:
                  node-version: ${{ matrix.node-version }}

            # Run lint
            - run: npm run type-check

    # The e2e tests no longer use the production image: check it builds and boots
    docker-build:
        runs-on: ubuntu-22.04
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
            - run: docker compose -f docker-compose.prod.yml up -d --build
            - run: ./bin/wait-for -t 180 localhost:3000
            - run: curl -fsS -o /dev/null localhost:3000
            - name: Dump logs
              if: failure()
              run: docker compose -f docker-compose.prod.yml logs --no-color lodex
