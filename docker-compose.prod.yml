version: '3'

services:
    lodex:
        build:
            context: .
        environment:
            npm_config_cache: /app/.npm
            CYPRESS_CACHE_FOLDER: /app/.cache
            http_proxy: ${http_proxy}
            https_proxy: ${https_proxy}
            NODE_OPTIONS: ${NODE_OPTIONS}
            EZMASTER_TECHNICAL_NAME: 'lodex'
            no_proxy: 'localhost,127.0.0.1,'
            BABEL_DISABLE_CACHE: 1
            MONGODB_URI: 'mongodb://mongo:27017/lodex/?directConnection=true&serverSelectionTimeoutMS=5000'
        links:
            - mongo
        ports:
            - '3000:3000'
    mongo:
        image: inistcnrs/ezmaster-mongot:1.67.1-9
        ports:
            - '27017:27017'
